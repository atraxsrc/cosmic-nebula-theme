# Nebula for kitty, part of cosmic-nebula-theme (MIT).
# Colours follow the COSMIC Terminal scheme (cosmic-term/).
#
# Install: ./kitty/install.sh puts this in ~/.config/kitty/themes/, then in
# ~/.config/kitty/kitty.conf:
#   include themes/Nebula.conf

foreground              #E0E6ED
background              #181C22
selection_foreground    none
selection_background    #2C3444

cursor                  #4ECDC4
cursor_text_color       #181C22

url_color               #C9AFF0
url_style               curly

active_border_color     #4ECDC4
inactive_border_color   #5B6478
bell_border_color       #FFB38A

active_tab_foreground   #181C22
active_tab_background   #4ECDC4
inactive_tab_foreground #96AAFF
inactive_tab_background #20252C
tab_bar_background      #181C22

mark1_foreground        #181C22
mark1_background        #82EEFF
mark2_foreground        #181C22
mark2_background        #C9AFF0
mark3_foreground        #181C22
mark3_background        #FFB38A

