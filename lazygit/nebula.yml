# Nebula for lazygit, part of cosmic-nebula-theme (MIT). Only the colours: your
# own ~/.config/lazygit/config.yml keeps the rest.
#
# Install: ./lazygit/install.sh puts this in ~/.config/lazygit/nebula.yml and
# zsh/nebula.zsh sets LG_CONFIG_FILE to "config.yml,nebula.yml" so lazygit
# reads both (the later file wins). Without the zsh layer:
#   export LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,$HOME/.config/lazygit/nebula.yml"
gui:
  theme:
    activeBorderColor:
      - "#4ECDC4"
      - bold
    inactiveBorderColor:
      - "#5B6478"
    searchingActiveBorderColor:
      - "#FFB38A"
      - bold
    optionsTextColor:
      - "#96AAFF"
    selectedLineBgColor:
      - "#272C34"
    inactiveViewSelectedLineBgColor:
      - "#20252C"
    cherryPickedCommitFgColor:
      - "#181C22"
    cherryPickedCommitBgColor:
      - "#C9AFF0"
    markedBaseCommitFgColor:
      - "#181C22"
    markedBaseCommitBgColor:
      - "#82EEFF"
    unstagedChangesColor:
      - "#FF7B92"
    defaultFgColor:
      - "#E0E6ED"
  authorColors:
    "*": "#C9AFF0"
