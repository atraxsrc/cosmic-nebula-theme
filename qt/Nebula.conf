# Nebula colour scheme for qt5ct / qt6ct, part of cosmic-nebula-theme (MIT).
# The rice's window colour for windows, its containers for buttons and
# tooltips, its text colour, the accent as highlight with the button text
# colour on it, dim placeholders.
#
# Install: ./qt/install.sh puts this in ~/.config/qt5ct/colors/ and
# ~/.config/qt6ct/colors/. Then in qt5ct / qt6ct: Appearance -> Color scheme
# -> Nebula, Palette: Custom, Apply. Qt apps need QT_QPA_PLATFORMTHEME=qt5ct
# (or qt6ct) in the environment to read it.
#
# Roles, in order: WindowText, Button, Light, Midlight, Dark, Mid, Text,
# BrightText, ButtonText, Base, Window, Shadow, Highlight, HighlightedText,
# Link, LinkVisited, AlternateBase, NoRole, ToolTipBase, ToolTipText,
# PlaceholderText
[ColorScheme]
active_colors=#e0e6ed, #20252c, #5b6478, #2c3444, #101318, #272c34, #e0e6ed, #efedf2, #e0e6ed, #101318, #181c22, #101318, #4ecdc4, #181c22, #4ecdc4, #4ecdc4, #20252c, #181c22, #20252c, #e0e6ed, #848e9f
disabled_colors=#5b6478, #20252c, #5b6478, #2c3444, #101318, #272c34, #5b6478, #96aaff, #5b6478, #181c22, #181c22, #101318, #5b6478, #96aaff, #848e9f, #848e9f, #20252c, #181c22, #20252c, #e0e6ed, #5b6478
inactive_colors=#e0e6ed, #20252c, #5b6478, #2c3444, #101318, #272c34, #e0e6ed, #efedf2, #e0e6ed, #101318, #181c22, #101318, #4ecdc4, #181c22, #4ecdc4, #4ecdc4, #20252c, #181c22, #20252c, #e0e6ed, #848e9f
